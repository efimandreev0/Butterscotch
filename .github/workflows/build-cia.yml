name: Build CIA

on:
  workflow_dispatch: {}

jobs:
  build-cia:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install devkitPro pacman (deb installer)
        run: |
          set -eux
          # Use curl with retries and show output for debugging
          # Try to download installer; if it fails (403) proceed to fallbacks
          if ! curl -sSL -o install-devkitpro-pacman https://apt.devkitpro.org/install-devkitpro-pacman; then
            echo "installer download failed; will try fallbacks"
          else
            chmod +x install-devkitpro-pacman
            sudo bash ./install-devkitpro-pacman || true
          fi
          # Verify dkp-pacman exists
          if ! command -v dkp-pacman >/dev/null 2>&1; then
            echo "dkp-pacman not available after installer; proceeding to fallbacks"
            ls -la || true
            cat install-devkitpro-pacman || true
          fi

      - name: Update pacman & install 3DS tools
        run: |
          # dkp-pacman should be available after the installer; try to update and install makerom/bannertool
          if command -v dkp-pacman >/dev/null 2>&1; then
            sudo dkp-pacman -Syu --noconfirm || true
            sudo dkp-pacman -S --noconfirm makerom bannertool 3ds-dev || true
          else
            echo "dkp-pacman not available; trying fallback: download prebuilt makerom/bannertool into tools-local/bin"
            mkdir -p tools-local/bin || true
            export PATH="$PWD/tools-local/bin:$PATH"
            # candidate URLs for makerom/bannertool (try multiple common locations)
            MAKEROM_URLS=(
              "https://github.com/devkitPro/makerom/releases/latest/download/makerom"
              "https://github.com/smealum/makerom/releases/latest/download/makerom"
              "https://github.com/ihaveamac/makerom/releases/latest/download/makerom"
            )
            BANNERT_URLS=(
              "https://github.com/devkitPro/bannertool/releases/latest/download/bannertool"
              "https://github.com/smealum/bannertool/releases/latest/download/bannertool"
            )
            set +e
            for u in "${MAKEROM_URLS[@]}"; do
              echo "Trying $u"
              curl -fsSL -o tools-local/bin/makerom "$u" && break || true
            done
            for u in "${BANNERT_URLS[@]}"; do
              echo "Trying $u"
              curl -fsSL -o tools-local/bin/bannertool "$u" && break || true
            done
            # Try downloading release assets via gh (if available)
            if [ ! -f tools-local/bin/makerom ]; then
              echo "Trying gh release download for devkitPro/makerom"
              gh release download --repo devkitPro/makerom --pattern 'makerom' --dir tools-local/bin || true
            fi
            if [ ! -f tools-local/bin/bannertool ]; then
              echo "Trying gh release download for devkitPro/bannertool"
              gh release download --repo devkitPro/bannertool --pattern 'bannertool' --dir tools-local/bin || true
            fi
            set -e
            if [ -f tools-local/bin/makerom ]; then chmod +x tools-local/bin/makerom; fi
            if [ -f tools-local/bin/bannertool ]; then chmod +x tools-local/bin/bannertool; fi
            if ! command -v makerom >/dev/null 2>&1 || ! command -v bannertool >/dev/null 2>&1; then
              echo "Fallback binaries not found. Will attempt to build makerom/bannertool from source."
              # Attempt to build makerom and bannertool from source
              sudo apt-get update || true
              sudo apt-get install -y git build-essential cmake libssl-dev zlib1g-dev libbz2-dev liblzma-dev || true
              mkdir -p /tmp/devkit-tools && cd /tmp/devkit-tools
              if [ ! -d makerom-src ]; then
                git clone https://github.com/smealum/makerom.git makerom-src || true
              fi
              if [ -d makerom-src ]; then
                cd makerom-src
                mkdir -p build && cd build
                cmake .. || true
                make -j$(nproc) || true
                if [ -f makerom ]; then mv makerom "$GITHUB_WORKSPACE/tools-local/bin/makerom" || true; fi
              fi
              cd "$GITHUB_WORKSPACE"
            fi
            # final check
            if ! command -v makerom >/dev/null 2>&1 || ! command -v bannertool >/dev/null 2>&1; then
              echo "makerom or bannertool still missing after fallbacks; aborting"; exit 1
            fi
          fi

      - name: Configure and build CIA
        run: |
          mkdir -p build-3ds
          cd build-3ds
          cmake -DPLATFORM=3ds ..
          cmake --build . --target butterscotch_cia -j$(nproc)

      - name: Upload CIA artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: butterscotch-cia
          path: build-3ds/butterscotch.cia
